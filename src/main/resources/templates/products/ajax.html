<!DOCTYPE html>
<html lang="vi"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/layout}">

<head>
	<title>Danh sách Product</title>
</head>

<body>
<section layout:fragment="content">

	<div class="d-flex justify-content-between align-items-center">
		<h2>Danh sách Product (AJAX + REST API)</h2>
		<button class="btn btn-success" onclick="showCreateNewProductModal()">+ Thêm Product</button>
	</div>

	<div id="alertBox" class="mt-3"></div>

	<table class="table table-striped table-hover mt-3 align-middle">
		<thead class="table-dark">
			<tr>
				<th>Id</th>
				<th>Hình ảnh</th>
				<th>Tên sản phẩm</th>
				<th>Category</th>
				<th>Giá</th>
				<th>Giảm giá</th>
				<th>SL</th>
				<th>Trạng thái</th>
				<th>Thao tác</th>
			</tr>
		</thead>
		<tbody id="productTableBody"></tbody>
	</table>

	<!-- MODAL: ADD -->
	<div class="modal" tabindex="-1" role="dialog" id="createProductModal">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<form id="addProductForm" method="post" onsubmit="return false;" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title">Thêm Product</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body row g-3">
						<div class="col-md-6">
							<label class="form-label">Tên sản phẩm</label>
							<input type="text" class="form-control" name="productName" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Category</label>
							<select class="form-select" name="categoryId" required>
								<option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
							</select>
						</div>
						<div class="col-md-4">
							<label class="form-label">Giá</label>
							<input type="number" step="0.01" class="form-control" name="unitPrice" required>
						</div>
						<div class="col-md-4">
							<label class="form-label">Giảm giá</label>
							<input type="number" step="0.01" class="form-control" name="discount" value="0" required>
						</div>
						<div class="col-md-4">
							<label class="form-label">Số lượng</label>
							<input type="number" class="form-control" name="quantity" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Trạng thái</label>
							<select class="form-select" name="status">
								<option value="1">Đang bán</option>
								<option value="0">Ngừng bán</option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Hình ảnh</label>
							<input type="file" class="form-control" name="imageFile" accept="image/*">
						</div>
						<div class="col-12">
							<label class="form-label">Mô tả</label>
							<textarea class="form-control" name="description" rows="3"></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
						<button type="submit" class="btn btn-primary">Thêm</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- MODAL: EDIT -->
	<div class="modal" tabindex="-1" role="dialog" id="updateProductModal">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<form id="updateProductForm" method="post" onsubmit="return false;" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title">Cập nhật Product</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body row g-3">
						<input type="hidden" name="productId" id="up_productId">
						<div class="col-md-6">
							<label class="form-label">Tên sản phẩm</label>
							<input type="text" class="form-control" name="productName" id="up_productName" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Category</label>
							<select class="form-select" name="categoryId" id="up_categoryId" required>
								<option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
							</select>
						</div>
						<div class="col-md-4">
							<label class="form-label">Giá</label>
							<input type="number" step="0.01" class="form-control" name="unitPrice" id="up_unitPrice" required>
						</div>
						<div class="col-md-4">
							<label class="form-label">Giảm giá</label>
							<input type="number" step="0.01" class="form-control" name="discount" id="up_discount" required>
						</div>
						<div class="col-md-4">
							<label class="form-label">Số lượng</label>
							<input type="number" class="form-control" name="quantity" id="up_quantity" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Trạng thái</label>
							<select class="form-select" name="status" id="up_status">
								<option value="1">Đang bán</option>
								<option value="0">Ngừng bán</option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Hình ảnh mới (bỏ trống nếu giữ ảnh cũ)</label>
							<input type="file" class="form-control" name="imageFile" accept="image/*">
						</div>
						<div class="col-12">
							<label class="form-label">Mô tả</label>
							<textarea class="form-control" name="description" id="up_description" rows="3"></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
						<button type="submit" class="btn btn-primary">Cập nhật</button>
					</div>
				</form>
			</div>
		</div>
	</div>

<script th:inline="javascript">
var contextPath = "";

function showAlert(message, ok) {
	var cls = ok ? "alert-success" : "alert-danger";
	$("#alertBox").html('<div class="alert ' + cls + '">' + message + '</div>');
	setTimeout(function () { $("#alertBox").html(""); }, 3000);
}

function formatMoney(n) {
	return Number(n).toLocaleString('vi-VN');
}

function loadProducts() {
	$.getJSON(contextPath + "/api/product", function (res) {
		var list = res.body;
		var tr = [];
		for (var i = 0; i < list.length; i++) {
			var p = list[i];
			var img = p.images
				? '<img src="/uploads/' + p.images + '" style="width:60px;height:60px;object-fit:cover;border-radius:4px;">'
				: 'Chưa có ảnh';
			var cateName = p.category ? p.category.categoryName : '';
			var status = p.status == 1 ? '<span class="badge bg-success">Đang bán</span>' : '<span class="badge bg-secondary">Ngừng bán</span>';

			tr.push('<tr>');
			tr.push('<td>' + p.productId + '</td>');
			tr.push('<td>' + img + '</td>');
			tr.push('<td>' + p.productName + '</td>');
			tr.push('<td>' + cateName + '</td>');
			tr.push('<td>' + formatMoney(p.unitPrice) + '</td>');
			tr.push('<td>' + formatMoney(p.discount) + '</td>');
			tr.push('<td>' + p.quantity + '</td>');
			tr.push('<td>' + status + '</td>');
			tr.push('<td>' +
				'<button class="btn btn-warning btn-sm me-1" onclick=\'editProduct(' + JSON.stringify(p) + ')\'>Sửa</button>' +
				'<button class="btn btn-danger btn-sm" onclick="deleteProduct(' + p.productId + ')">Xóa</button>' +
				'</td>');
			tr.push('</tr>');
		}
		$("#productTableBody").html(tr.join(""));
	});
}

function showCreateNewProductModal() {
	$("#addProductForm")[0].reset();
	new bootstrap.Modal(document.getElementById('createProductModal')).show();
}

function editProduct(p) {
	$("#up_productId").val(p.productId);
	$("#up_productName").val(p.productName);
	$("#up_categoryId").val(p.category ? p.category.categoryId : '');
	$("#up_unitPrice").val(p.unitPrice);
	$("#up_discount").val(p.discount);
	$("#up_quantity").val(p.quantity);
	$("#up_status").val(p.status);
	$("#up_description").val(p.description);
	new bootstrap.Modal(document.getElementById('updateProductModal')).show();
}

function deleteProduct(id) {
	if (!confirm("Bạn có chắc muốn xóa Product này?")) {
		return;
	}
	$.ajax({
		type: "DELETE",
		url: contextPath + "/api/product/deleteProduct?productId=" + id,
		dataType: "json",
		success: function (res) {
			showAlert(res.message, res.status);
			loadProducts();
		},
		error: function (xhr) {
			showAlert("Xóa thất bại: " + (xhr.responseJSON ? xhr.responseJSON.message : xhr.statusText), false);
		}
	});
}

$(document).ready(function () {
	loadProducts();

	$("#addProductForm").submit(function () {
		var formData = new FormData(this);
		$.ajax({
			url: contextPath + "/api/product/addProduct",
			type: "POST",
			dataType: "json",
			data: formData,
			cache: false,
			contentType: false,
			processData: false,
			success: function (res) {
				bootstrap.Modal.getInstance(document.getElementById('createProductModal')).hide();
				showAlert(res.message, res.status);
				loadProducts();
			},
			error: function (xhr) {
				showAlert("Thêm thất bại: " + (xhr.responseJSON ? xhr.responseJSON.message : xhr.statusText), false);
			}
		});
	});

	$("#updateProductForm").submit(function () {
		var formData = new FormData(this);
		$.ajax({
			url: contextPath + "/api/product/updateProduct",
			type: "PUT",
			dataType: "json",
			data: formData,
			cache: false,
			contentType: false,
			processData: false,
			success: function (res) {
				bootstrap.Modal.getInstance(document.getElementById('updateProductModal')).hide();
				showAlert(res.message, res.status);
				loadProducts();
			},
			error: function (xhr) {
				showAlert("Cập nhật thất bại: " + (xhr.responseJSON ? xhr.responseJSON.message : xhr.statusText), false);
			}
		});
	});
});
</script>

</section>
</body>
</html>
